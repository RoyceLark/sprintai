<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Rich Salon</title>
<meta name="description" content="Rich Salon admin dashboard - view submitted appointment enquiries.">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
<header class="site-header">
  <div class="container header__inner">
    <a href="index.html" class="logo">Rich<span class="logo__accent">Salon</span></a>
    <nav class="nav-admin" aria-label="Admin">
      <ul class="nav__list">
        <li><a href="index.html" class="nav__link nav__link--admin" id="back-to-site">Back to site</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="admin-header">
        <h1 class="section__title" style="margin:0;">Admin Dashboard</h1>
      </div>
      <h2>Manage Services</h2>
      <form id="service-form" class="enquiry-form">
        <input type="hidden" id="service-id-input" value="">
        <div class="form-group">
          <label for="service-name">Service Name</label>
          <input type="text" id="service-name" name="name" required>
          <span class="form-error" id="service-name-error"></span>
        </div>
        <div class="form-group">
          <label for="service-description">Description</label>
          <textarea id="service-description" name="description" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="service-duration">Duration (minutes)</label>
          <input type="number" id="service-duration" name="duration" min="1" required>
          <span class="form-error" id="service-duration-error"></span>
        </div>
        <div class="form-group">
          <label for="service-price">Price ($)</label>
          <input type="number" id="service-price" name="price" min="0" step="0.01" required>
          <span class="form-error" id="service-price-error"></span>
        </div>
        <button type="submit" class="btn btn--primary" id="service-form-submit">Add Service</button>
        <button type="button" class="btn" id="service-form-cancel" hidden>Cancel edit</button>
      </form>

      <p class="admin-empty" id="no-services" hidden>No services have been added yet.</p>
      <table class="admin-table" id="services-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Duration</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="services-table-body"></tbody>
      </table>

      <h2>Submitted Enquiries</h2>
      <p class="admin-empty" id="no-enquiries" hidden>No enquiries have been submitted yet.</p>
      <table class="admin-table" id="enquiries-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Service</th>
            <th>Date</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="enquiries-table-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Rich Salon. All rights reserved.</p>
  </div>
</footer>

<script src="js/enquiry-store.js"></script>
<script src="js/service-store.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-services.js"></script>
</body>
</html>
